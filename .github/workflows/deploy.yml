name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/learnikal
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            .venv/bin/python -m pip install -r requirements.txt
            sudo -u postgres .venv/bin/python deploy/migrate-topics.py
            sudo -u postgres .venv/bin/python deploy/migrate-subtopics.py
            sudo -u postgres .venv/bin/python deploy/migrate-instructions.py
            sudo systemctl restart learnikal
            sudo systemctl status learnikal --no-pager
            for attempt in {1..10}; do
              if curl -fsS http://127.0.0.1:8000/health; then
                exit 0
              fi
              sleep 2
            done
            sudo journalctl -u learnikal -n 80 --no-pager
            exit 1
